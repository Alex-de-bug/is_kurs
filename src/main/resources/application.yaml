spring:
  application:
    name: calendar
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        bytecode:
          provider: bytebuddy
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: true

jwt:
  expiration: ${JWT_EXPIRATION}
  secret: ${JWT_SECRET}

server:
  port: 80

service:
  calendar:
    url: ${SERVICE_CALENDAR_URL}
